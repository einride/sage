version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /actions/setup
    schedule:
      interval: cron
      cronjob: "0 6 1 * *"
    cooldown:
      default-days: 7
      exclude:
        - github.com/einride/*
        - github.com/einride-autonomous/*
        - github.com/einride-labs/*
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: gomod
    directories:
      - "**/*"
    schedule:
      interval: cron
      cronjob: "0 6 1 * *"
    allow:
      - dependency-type: direct
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
      exclude:
        - github.com/einride/*
        - github.com/einride-autonomous/*
        - github.com/einride-labs/*
    groups:
      go-dependencies-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      go-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: tools/sgcspevaluatorcli
    schedule:
      interval: cron
      cronjob: "0 6 1 * *"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
      exclude:
        - github.com/einride/*
        - github.com/einride-autonomous/*
        - github.com/einride-labs/*
    groups:
      npm-dependencies-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: tools/sgmdformat
    schedule:
      interval: cron
      cronjob: "0 6 1 * *"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
      exclude:
        - github.com/einride/*
        - github.com/einride-autonomous/*
        - github.com/einride-labs/*
    groups:
      python-dependencies-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      python-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
